plugins {
    id "com.android.application"
}

def releaseStoreFile = System.getenv("LMT_UPLOAD_STORE_FILE")
def releaseStorePassword = System.getenv("LMT_UPLOAD_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("LMT_UPLOAD_KEY_ALIAS")
def releaseKeyPassword = System.getenv("LMT_UPLOAD_KEY_PASSWORD")
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace "com.personal.livetranslator"
    compileSdk 35

    defaultConfig {
        applicationId "com.personal.livetranslator"
        minSdk 29
        targetSdk 35
        versionCode 100
        versionName "1.0.0"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.alphacephei:vosk-android:0.3.75@aar"
    implementation "net.java.dev.jna:jna:5.18.1@aar"
    implementation "com.google.mlkit:translate:17.0.3"
    implementation files("libs/sherpa-onnx-static-link-onnxruntime-1.13.2.aar")
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.20"
    implementation "org.apache.commons:commons-compress:1.26.2"
}
